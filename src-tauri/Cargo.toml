[package]
name = "mihoyo-widget"
version = "1.3.0"
description = "米游社桌面小组件（v1.3.0：冻结原神便签；zzz 便签 + 签到；战绩域仅手动刷新）"
authors = ["you"]
edition = "2021"

[lib]
name = "mihoyo_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ⚠️⚠️ 正式版打包必需，勿删！
#
# 源码依据：`tauri-2.11.5/build.rs:255`
#   let custom_protocol = has_feature("custom-protocol");
#   let dev = !custom_protocol;          // 未启用该 feature → 判定为 dev
#   alias("dev", dev);                   // 于是 tauri::generate_context! 内嵌 devUrl
#
# 后果（2026-10-14 实际踩坑）：直接跑 `cargo build --release` 会生成一个
# **内嵌 `http://localhost:1420` 而非前端资源**的 exe → 双击启动后显示
# 「无法访问此页面 / localhost 拒绝连接」（因为只有 `npm run dev` 在跑时该端口才存在）。
#
# 正确打包方式（二选一）：
#   ① `npm run tauri build`            —— CLI 会自动注入本 feature（推荐）
#   ② `cargo build --release --features custom-protocol`  —— 直接用 cargo 时必须显式带上
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"] }
md5 = "0.7"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
anyhow = "1"
windows = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Registry"] }
